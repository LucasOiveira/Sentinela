<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midia-indoor</title>
    <style>
       * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================================
   TELA PRINCIPAL
   ========================================================= */

body {
    width: 100vw;
    height: 100vh;

    background: linear-gradient(
        135deg,
        #42bb9b 0%,
        #10698c 50%,
        #0ea282 100%
    );

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* =========================================================
   CONTAINER DA TV
   ========================================================= */

.tv-container {
    width: 94vw;
    height: 90vh;

    display: flex;

    gap: 20px;
}


/* =========================================================
   PAINEL ESQUERDO
   ========================================================= */

.left-panel {
    width: 32%;

    display: flex;
    flex-direction: column;

    gap: 20px;
}


/* =========================================================
   PAINEL DIREITO
   ========================================================= */

.right-panel {
    width: 68%;

    display: flex;
    flex-direction: column;

    gap: 20px;
}


/* =========================================================
   CAIXAS
   ========================================================= */

.box {
    position: relative;

    background: linear-gradient(
        145deg,
        #ffffff,
        #f3f7f9
    );

    border: 1px solid rgba(255, 255, 255, 0.7);

    border-radius: 20px;

    padding: 25px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);

    overflow: hidden;
}


/* =========================================================
   TÍTULOS DAS CAIXAS
   ========================================================= */

.box-title {
    color: #23404d;

    font-size: clamp(18px, 2vw, 32px);

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 15px;

    text-shadow:
        1px 1px 2px rgba(0, 0, 0, 0.12);
}


/* =========================================================
   LOCAL
   ========================================================= */

.local-box {
    flex: 1;

    background: linear-gradient(
        145deg,
        #dff8ff,
        #b9edf8
    );
}

.local-box .box-title {
    color: #14708b;
}

.local-number {
    color: #d12c2c;

    font-size: clamp(70px, 8vw, 150px);

    font-weight: 900;

    line-height: 0.95;

    text-shadow:
        2px 3px 4px rgba(0, 0, 0, 0.18);
}


/* =========================================================
   HISTÓRICO
   ========================================================= */

.history-box {
    flex: 1;

    justify-content: flex-start;
    align-items: stretch;

    background: #1da5b4;

    padding: 25px 30px;
}

.history-box .box-title {
    font-size: clamp(18px, 1.7vw, 28px);

    align-self: center;

    color: #23404d;
}


#history-list {
    width: 100%;

    list-style: none;

    margin-top: 8px;

    color: #c52b2b;

    font-size: clamp(16px, 1.5vw, 25px);

    font-weight: 700;

    text-align: left;
}


#history-list li {
    padding: 12px 5px;

    margin-bottom: 5px;

    border-bottom:
        1px solid #d8d8d8;
}


/* =========================================================
   PACIENTE
   ========================================================= */

.patient-box {
    flex: 3;

    background: linear-gradient(
        145deg,
        #159fbb,
        #eefcff
    );
}


.patient-box .box-title {
    color: #14708b;

    font-size: clamp(20px, 2vw, 34px);
}


.patient-name {
    width: 100%;

    color: #d12c2c;

    font-size: clamp(45px, 6vw, 110px);

    font-weight: 900;

    line-height: 1.1;

    word-break: break-word;

    overflow-wrap: break-word;

    text-shadow:
        2px 3px 4px rgba(0, 0, 0, 0.15);
}


/* =========================================================
   LOGO / RODAPÉ
   ========================================================= */

.logo-box {
    flex: 1;

    min-height: 120px;

    background: linear-gradient(
        135deg,
        #16a5af,
        #f7edf5
    );
}


.logo-text {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 20px;

    color: #8c3b7a;

    font-size: clamp(22px, 3vw, 48px);

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.logo-text img {
    width: clamp(70px, 9vw, 140px);

    height: auto;

    object-fit: contain;
}


/* =========================================================
   ANIMAÇÃO DA CHAMADA
   ========================================================= */

@keyframes flash {

    0% {
        opacity: 1;

        transform: scale(1);
    }

    50% {
        opacity: 0.45;

        transform: scale(1.015);
    }

    100% {
        opacity: 1;

        transform: scale(1);
    }
}


.flash {
    animation:
        flash 0.5s ease 3;
}


/* =========================================================
   DESTAQUE QUANDO A CHAMADA É FEITA
   ========================================================= */

.patient-box.flash {
    box-shadow:
        0 0 0 5px rgba(209, 44, 44, 0.25),
        0 15px 40px rgba(209, 44, 44, 0.3);
}


/* =========================================================
   TELAS MENORES
   ========================================================= */

@media (max-width: 900px) {

    .tv-container {
        width: 96vw;
        height: 92vh;

        gap: 12px;
    }

    .left-panel,
    .right-panel {
        gap: 12px;
    }

    .box {
        border-radius: 15px;

        padding: 15px;
    }

    .patient-name {
        font-size: 7vw;
    }

    #history-list {
        font-size: 2vw;
    }
}


/* =========================================================
   TELAS MUITO PEQUENAS
   ========================================================= */

@media (max-width: 600px) {

    .tv-container {
        width: 95vw;
        height: 94vh;

        flex-direction: column;
    }

    .left-panel,
    .right-panel {
        width: 100%;
    }

    .left-panel {
        height: 35%;
    }

    .right-panel {
        height: 65%;
    }

    .local-number {
        font-size: 18vw;
    }

    .patient-name {
        font-size: 10vw;
    }

    #history-list {
        font-size: 3vw;
    }
}
    </style>
</head>
<body>
    <!-- Estrutura da tela da TV criada para exibir o local e o nome do paciente chamado -->
     <div class="tv-container">
        <div class="left-panel">
            <div class="box local-box">
                <div class="box-title" id="local-tipo">GUICHE</div>
                <div class="local-number" id="local-number">----</div>
            </div>

            <div class="box history-box">
                <div class="box-title">ULTIMAS CHAMADAS</div>
                <ul id="history-list"></ul>
            </div>
        </div>
        <div class="right-panel">
            <div class="box patient-box">
                <div class="box-title">PACIENTE</div>
                <div class="patient-name" id="patient-name">AGUARDANDO...</div>
            </div>
            <div class="box logo-box">
                <div class="logo-text"> <img src="css/logo.svg" width="140" alt="Logo"> Sistema Hospitalar</div>
            </div>
        </div>
     </div>
     <script>
        let ultimold = null;
        // Função criada para buscar a chamada atual e o Histórico da tv em tempo real.
        function atualizar() {
            fetch("/tv/chamada")
            .then(r => r.json())
            .then(data => {
                const chamada = data.chamada;
                const historico = data.historico || [];

                if (chamada) {
                    document.getElementById("local-tipo").innerText = chamada.localTipo || "GUICHE";
                    document.getElementById("local-numero").innerText = chamada.localNumero || "--";
                    document.getElementById("patient-name").innerText = chamada.paciente || "AGUARDANDO...";
                    // Flash visual quando há chamada nova
                    if (chamada.id !== ultimold) {
                        ultimold = chamada.id;
                        const patientbox = document.querySelector(".patient-box");
                        patientbox.classList.remove("flash");
                        void patientbox.offsetwidth; // reflow
                        patientbox.classList.add("flash");
                    }
                }
                    //Historico
                    const list = document.getElementById("history-list");
                    list.innerHTML = "";
                    historico.slice(0, 4).forEach(h => {
                        const li = document.createElement("li");
                        const tipo = h.localTipo ? h.localTipo.substring(0,4) : "GUIC";
                        li.innerText = `${tipo}. ${h.localNumero} - ${h.paciente}`;
                    });
            
            })
            .catch(err => console.log("Erro ao buscar chamada", err));
        }

        //poling a cada 2 segundos
        atualizar();
        setInterval(atualizar, 2000);
     </script>
</body>
</html>
